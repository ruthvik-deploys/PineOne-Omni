<svg width="840" height="620" viewBox="0 0 840 620" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="840" height="620" rx="18" fill="#FFFFFF" stroke="#E3E7E5" stroke-width="1" opacity="1"/><text x="40" y="64" font-family="Inter" font-size="18" font-weight="600" fill="#1A1F1D" text-anchor="start" opacity="1">Phase 2 rollout</text><text x="40" y="90" font-family="Inter" font-size="13" font-weight="500" fill="#5C6461" text-anchor="start" opacity="1">Start small, learn, then scale</text><rect x="60" y="150" width="330" height="150" rx="16" fill="#F4F6F5" opacity="1"/><circle cx="100" cy="194" r="18" fill="#0F9B74"/><text x="100" y="199" font-family="Inter" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="1">1</text><text x="132" y="200" font-family="Inter" font-size="20" font-weight="600" fill="#1A1F1D" text-anchor="start" opacity="1">Few merchants</text><text x="88" y="250" font-family="Inter" font-size="14" font-weight="500" fill="#5C6461" text-anchor="start" opacity="1">A small first group</text><rect x="450" y="150" width="330" height="150" rx="16" fill="#F4F6F5" opacity="1"/><circle cx="490" cy="194" r="18" fill="#0F9B74"/><text x="490" y="199" font-family="Inter" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="1">2</text><text x="522" y="200" font-family="Inter" font-size="20" font-weight="600" fill="#1A1F1D" text-anchor="start" opacity="1">Watch usage</text><text x="478" y="250" font-family="Inter" font-size="14" font-weight="500" fill="#5C6461" text-anchor="start" opacity="1">What they use and where they stall</text><rect x="450" y="390" width="330" height="150" rx="16" fill="#F4F6F5" opacity="1"/><circle cx="490" cy="434" r="18" fill="#0F9B74"/><text x="490" y="439" font-family="Inter" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="1">3</text><text x="522" y="440" font-family="Inter" font-size="20" font-weight="600" fill="#1A1F1D" text-anchor="start" opacity="1">Test &amp; refine</text><text x="478" y="490" font-family="Inter" font-size="14" font-weight="500" fill="#5C6461" text-anchor="start" opacity="1">Fix what we learn</text><rect x="60" y="390" width="330" height="150" rx="16" fill="#0F9B74" fill-opacity="0.1" stroke="#0F9B74" stroke-width="1.5" opacity="1"/><circle cx="100" cy="434" r="18" fill="#0F9B74"/><text x="100" y="439" font-family="Inter" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="1">4</text><text x="132" y="440" font-family="Inter" font-size="20" font-weight="600" fill="#1A1F1D" text-anchor="start" opacity="1">Scale up</text><text x="88" y="490" font-family="Inter" font-size="14" font-weight="500" fill="#5C6461" text-anchor="start" opacity="1">A much bigger share of merchants</text><line x1="398" y1="225" x2="442" y2="225" stroke="#0F9B74" stroke-width="2"/><path d="M442 225 L433.0 229.3 L433.0 220.7 Z" fill="#0F9B74"/><line x1="615" y1="308" x2="615" y2="382" stroke="#0F9B74" stroke-width="2"/><path d="M615 382 L610.7 373.0 L619.3 373.0 Z" fill="#0F9B74"/><line x1="442" y1="465" x2="398" y2="465" stroke="#0F9B74" stroke-width="2"/><path d="M398 465 L407.0 460.7 L407.0 469.3 Z" fill="#0F9B74"/><line x1="215" y1="382" x2="215" y2="308" stroke="#8C9490" stroke-width="2" stroke-dasharray="6 5"/><path d="M215 308 L219.3 317.0 L210.7 317.0 Z" fill="#8C9490"/><rect x="230" y="334" width="159.2" height="24" rx="12" fill="#0F9B74" opacity="1"/><text x="309.6" y="350" font-family="Inter" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="1">Repeat with each group</text></svg>